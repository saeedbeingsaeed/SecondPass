# Render Blueprint: New → Blueprint → pick this repo. Free plan, built from the Dockerfile.
services:
  - type: web
    name: secondpass
    runtime: docker
    plan: free
    healthCheckPath: /ping
    autoDeploy: true
    envVars:
      # Secrets: Render asks for these on first deploy (sync: false keeps them out of git).
      - key: APP_ID
        sync: false
      - key: PRIVATE_KEY
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      # Plain settings.
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: LOG_LEVEL
        value: info
